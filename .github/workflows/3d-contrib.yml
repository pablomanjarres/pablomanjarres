name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: contribution-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test contribution data parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch complete contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set PROFILE_STATS_TOKEN with repo and read:user scopes. See docs/contribution-setup.md."
            exit 1
          fi
          python3 scripts/fetch_contribution_data.py --username "${{ github.repository_owner }}" --require-complete
      - name: Render contribution showcase
        run: python3 scripts/render_contribution_showcase.py --theme blue
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: update 3d contribution calendar" || echo "no changes"
          git push
      - name: Track refresh status in an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Contribution card refresh is failing
        run: |
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == env.TITLE) | .number")
          if [ "$JOB_STATUS" = "success" ]; then
            for number in $open; do
              gh issue close "$number" --comment "Refresh succeeded: $RUN_URL"
            done
          elif [ -n "$open" ]; then
            gh issue comment "${open%%[[:space:]]*}" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled contribution refresh failed: $RUN_URL

          The profile card keeps its last good snapshot until a run succeeds. Read the fetch step log, then see docs/contribution-setup.md. This issue closes on the next successful run."
          fi
