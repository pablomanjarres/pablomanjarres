name: Generate 3D contribution calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test contribution data parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch complete contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set PROFILE_STATS_TOKEN with repo and read:user scopes. See docs/contribution-setup.md."
            exit 1
          fi
          python3 scripts/fetch_contribution_data.py --username "${{ github.repository_owner }}" --require-complete
      - name: Render contribution showcase
        run: python3 scripts/render_contribution_showcase.py --theme blue
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: update 3d contribution calendar" || echo "no changes"
          git push
